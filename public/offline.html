<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sei offline · Team Italfit</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        padding: 24px; box-sizing: border-box; text-align: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #ffffff; color: #0f0f10;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0e0e0f; color: #ededee; }
        .muted { color: #a0a0a4; }
      }
      main { max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; }
      .muted { color: #5f5f64; font-size: 14px; }
      button {
        font: inherit; font-weight: 600; padding: 10px 18px; border: 0;
        border-radius: 10px; background: #0f0f10; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) { button { background: #ededee; color: #0e0e0f; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Sei offline</h1>
      <p class="muted">
        Team Italfit ha bisogno di una connessione per mostrare i tuoi dati
        aggiornati. Controlla la rete e riprova.
      </p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
